        - name: KEYSTORE_PATH
          value: /app/keystores/keystore.p12
        - name: KEYSTORE_PASSWORD
          value: change-me-keystore
        - name: TRUSTSTORE_PATH
          value: /app/keystores/truststore.p12
        - name: TRUSTSTORE_PASSWORD
          value: change-me-truststore
        - name: SPRING_DATASOURCE_USERNAME
          value: karavan
        - name: SPRING_DATASOURCE_PASSWORD
          value: karavan
        - name: SPRING_FLYWAY_USER
          value: karavan
        - name: SPRING_FLYWAY_PASSWORD
          value: karavan
        - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
          value: 'true'
        - name: SPRING_FLYWAY_VALIDATE_ON_MIGRATE
          value: 'false'
        - name: SPRING_FLYWAY_REPAIR_ON_MIGRATE
          value: 'true'
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: none
        - name: SPRING_RABBITMQ_HOST
          value: 192.168.56.10
        - name: SPRING_RABBITMQ_PORT
          value: '5672'
        - name: SPRING_RABBITMQ_USERNAME
          value: karavan
        - name: SPRING_RABBITMQ_PASSWORD
          value: karavan
        - name: SPRING_RABBITMQ_USER
          value: karavan
        - name: SPRING_RABBITMQ_PASS
          value: karavan
        - name: SPRING_RABBITMQ_VIRTUAL_HOST
          value: ebms
        - name: SPRING_RABBITMQ_VIRTUALHOST
          value: ebms
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://192.168.56.10:5432/karavan?currentSchema=cpa&stringtype=unspecified
        envFrom:
        - configMapRef:
            name: ebms-cpa-service-config
        - secretRef:
            name: ebms-cpa-service-secret
        image: 192.168.56.10:5555/municipal/ebms-cpa:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 180
          periodSeconds: 15
        name: cpa-service
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 180
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 125m
            memory: 256Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: ebms-cpa-service
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: ebms
            app.kubernetes.io/name: cpa-service
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
