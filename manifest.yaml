spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /services/ebms
        pathType: Prefix
        backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              number: 8080
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              number: 8080
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              number: 8080
      - path: /api/cpa
        pathType: Prefix
        backend:
          service:
            name: ebms-cpa-service
            port:
              number: 8081
      - path: /api/crypto
        pathType: Prefix
        backend:
          service:
            name: ebms-crypto-service
            port:
              number: 8082
