    konghq.com/plugins: ebms-rate-limit
    konghq.com/preserve-host: 'true'
    konghq.com/protocols: https
    konghq.com/strip-path: 'false'
  labels:
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/instance: ebms
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ebms-orchestrator
    app.kubernetes.io/part-of: ebms-adapter
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: ebms-orchestrator-1.0.0
  name: ebms-ebms-orchestrator
  namespace: default
spec:
  ingressClassName: kong
  rules:
  - host: ebms.example.com
    http:
      paths:
      - backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              name: http
        path: /soap/ebms
        pathType: Prefix
      - backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              name: http
        path: /admin
        pathType: Prefix
      - backend:
          service:
            name: ebms-ebms-orchestrator
            port:
              name: http
        path: /api/admin
        pathType: Prefix
      - backend:
          service:
            name: ebms-cpa-service
            port:
              number: 8081
        path: /api/cpa
        pathType: Prefix
  tls:
  - hosts:
    - ebms.example.com
    secretName: ebms-tls-cert
