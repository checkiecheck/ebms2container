apiVersion: v2
name: ebms-adapter
description: >
  Digikoppeling ebMS2 Adapter – umbrella Helm chart.
  Bevat drie microservices (ebms-orchestrator, cpa-service, crypto-service)
  plus een gedeeld PostgreSQL-cluster en RabbitMQ.

type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  # ── Infrastructuur ───────────────────────────────────────────────────────
  - name: postgresql
    version: "16.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    alias: postgresql

  - name: rabbitmq
    version: "14.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    alias: rabbitmq
