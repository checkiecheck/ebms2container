apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebms-orchestrator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebms-orchestrator.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/ebms_orchestrator"
  SPRING_DATASOURCE_USERNAME: "ebms"
  SPRING_RABBITMQ_HOST: "{{ .Release.Name }}-rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "ebms_amqp"
  SPRING_RABBITMQ_VIRTUAL_HOST: {{ .Values.env.SPRING_RABBITMQ_VIRTUAL_HOST | default "ebms" | quote }}
  CPA_SERVICE_URL: {{ .Values.env.CPA_SERVICE_URL | default "http://cpa-service:8081" | quote }}
  CRYPTO_SERVICE_URL: {{ .Values.env.CRYPTO_SERVICE_URL | default "http://crypto-service:8082" | quote }}
  EBMS_SIGNING_KEY_ALIAS: {{ .Values.env.EBMS_SIGNING_KEY_ALIAS | default "signing-key" | quote }}
  EBMS_DECRYPTION_KEY_ALIAS: {{ .Values.env.EBMS_DECRYPTION_KEY_ALIAS | default "encryption-key" | quote }}
  EBMS_CONNECT_TIMEOUT_MS: {{ .Values.env.EBMS_CONNECT_TIMEOUT_MS | default "10000" | quote }}
  EBMS_READ_TIMEOUT_MS: {{ .Values.env.EBMS_READ_TIMEOUT_MS | default "30000" | quote }}
