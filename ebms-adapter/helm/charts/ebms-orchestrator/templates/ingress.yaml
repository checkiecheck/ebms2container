{{- $ingress := .Values.ingress | default dict }}
{{- $auth := $ingress.auth | default dict }}
{{- $soapSettings := $ingress.soap | default dict }}
{{- $adminSettings := $ingress.admin | default dict }}
{{- $adminAuth := $auth.admin | default dict }}
{{- $soapAuth := $auth.soap | default dict }}
{{- $authRequired := $auth.required | default false }}
{{- $adminAuthPlugin := $adminAuth.plugin | default "" }}
{{- $soapAuthPlugin := $soapAuth.plugin | default "" }}
{{- if .Values.ingress.enabled }}
{{- if $authRequired }}
{{- $adminAuthPlugin = required "ingress.auth.admin.plugin must be configured when ingress.auth.required=true" $adminAuthPlugin }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ebms-orchestrator.fullname" . }}-soap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebms-orchestrator.labels" . | nindent 4 }}
  annotations:
    {{- with ($soapSettings.annotations | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $soapAuthPlugin }}
    konghq.com/plugins: {{ list "ebms-rate-limit" $soapAuthPlugin | join "," | quote }}
    {{- else }}
    konghq.com/plugins: "ebms-rate-limit"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .soapPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ebms-orchestrator.fullname" $ }}
                port:
                  name: http
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ebms-orchestrator.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebms-orchestrator.labels" . | nindent 4 }}
  annotations:
    {{- with ($adminSettings.annotations | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $adminAuthPlugin }}
    konghq.com/plugins: {{ $adminAuthPlugin | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "ebms-orchestrator.fullname" $ }}
                port:
                  name: http
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "ebms-orchestrator.fullname" $ }}
                port:
                  name: http
          {{- if $.Values.ingress.cpaServiceRoute.enabled }}
          - path: {{ $.Values.ingress.cpaServiceRoute.path }}
            pathType: {{ $.Values.ingress.cpaServiceRoute.pathType }}
            backend:
              service:
                name: {{ $.Values.ingress.cpaServiceRoute.serviceName | default (printf "%s-cpa-service" $.Release.Name) }}
                port:
                  number: {{ $.Values.ingress.cpaServiceRoute.servicePort }}
          {{- end }}
    {{- end }}
---
# KongPlugin: rate limiting voor het SOAP-endpoint.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ebms-rate-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebms-orchestrator.labels" . | nindent 4 }}
plugin: rate-limiting
config:
  minute: 100
  policy: local
{{- end }}
