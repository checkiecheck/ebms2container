apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ebms-orchestrator.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebms-orchestrator.labels" . | nindent 4 }}
  annotations:
    # In productie: gebruik external-secrets of sealed-secrets i.p.v. plain-text values
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.SPRING_DATASOURCE_PASSWORD | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.secret.SPRING_RABBITMQ_PASSWORD | quote }}
