<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>ebms-orchestrator | Message Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

  <header class="border-b border-slate-800 bg-slate-900/60 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-slate-100">ebms-orchestrator <span class="text-emerald-400">/ Message Monitor</span></h1>
      <p class="text-xs text-slate-500 mt-0.5">Digikoppeling ebMS2 · Reliable Messaging status overview</p>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <span id="autoRefreshLabel" class="text-slate-500">auto-refresh 10s</span>
      <button id="refreshBtn" data-testid="refresh-button"
        class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-medium transition-colors">
        Refresh
      </button>
    </div>
  </header>

  <main class="p-6 max-w-7xl mx-auto">
    <div class="rounded-lg border border-slate-800 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-900 text-slate-400 text-xs uppercase tracking-wide">
          <tr>
            <th class="text-left px-4 py-3">Message ID</th>
            <th class="text-left px-4 py-3">Conversation</th>
            <th class="text-left px-4 py-3">From → To</th>
            <th class="text-left px-4 py-3">Dir</th>
            <th class="text-left px-4 py-3">Status</th>
            <th class="text-left px-4 py-3">Retries</th>
            <th class="text-left px-4 py-3">Timestamp</th>
          </tr>
        </thead>
        <tbody id="messageRows" data-testid="message-rows" class="divide-y divide-slate-800">
          <tr><td colspan="7" class="px-4 py-8 text-center text-slate-500">Laden...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-between mt-4 text-sm text-slate-400">
      <span id="pageInfo" data-testid="page-info">-</span>
      <div class="flex gap-2">
        <button id="prevBtn" data-testid="prev-page-button"
          class="px-3 py-1.5 rounded-md border border-slate-700 hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
          ← Vorige
        </button>
        <button id="nextBtn" data-testid="next-page-button"
          class="px-3 py-1.5 rounded-md border border-slate-700 hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
          Volgende →
        </button>
      </div>
    </div>
  </main>

  <!-- Details modal -->
  <div id="detailsModal" data-testid="details-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-lg max-w-3xl w-full max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800 sticky top-0 bg-slate-900">
        <h2 class="font-semibold text-slate-100">Bericht-details</h2>
        <button id="closeModalBtn" data-testid="close-modal-button" class="text-slate-400 hover:text-slate-100">✕</button>
      </div>
      <div id="detailsBody" data-testid="details-body" class="p-5 text-sm space-y-3"></div>
    </div>
  </div>

  <script>
    const API_URL = '/api/admin/messages';
    const PAGE_SIZE = 50;
    let currentPage = 0;
    let currentData = [];
    let refreshTimer = null;

    const statusBadge = (status) => {
      const map = {
        DELIVERED:   'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
        ACKNOWLEDGED:'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
        SENT:        'bg-amber-500/15 text-amber-400 border-amber-500/30',
        PROCESSING:  'bg-amber-500/15 text-amber-400 border-amber-500/30',
        RECEIVED:    'bg-sky-500/15 text-sky-400 border-sky-500/30',
        FAILED:      'bg-red-500/15 text-red-400 border-red-500/30',
        DUPLICATE:   'bg-red-500/15 text-red-400 border-red-500/30',
      };
      const cls = map[status] || 'bg-slate-500/15 text-slate-400 border-slate-500/30';
      return `<span class="px-2 py-0.5 rounded border text-xs font-medium ${cls}" data-testid="status-badge-${status}">${status}</span>`;
    };

    function fmtTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return d.toLocaleString('nl-NL');
    }

    async function loadMessages(page = 0) {
      try {
        const res = await fetch(`${API_URL}?page=${page}&size=${PAGE_SIZE}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentData = data.content || [];
        currentPage = data.number ?? page;
        renderRows(currentData);
        renderPageInfo(data);
      } catch (err) {
        document.getElementById('messageRows').innerHTML =
          `<tr><td colspan="7" class="px-4 py-8 text-center text-red-400" data-testid="load-error">Kon berichten niet laden: ${err.message}</td></tr>`;
      }
    }

    function renderRows(rows) {
      const tbody = document.getElementById('messageRows');
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500">Geen berichten gevonden</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((m, idx) => `
        <tr class="hover:bg-slate-900/60 cursor-pointer transition-colors" data-testid="message-row-${idx}" onclick="openDetails(${idx})">
          <td class="px-4 py-3 text-slate-300 truncate max-w-[220px]" title="${m.messageId}">${m.messageId}</td>
          <td class="px-4 py-3 text-slate-400 truncate max-w-[160px]" title="${m.conversationId}">${m.conversationId}</td>
          <td class="px-4 py-3 text-slate-400">${m.fromPartyId} → ${m.toPartyId}</td>
          <td class="px-4 py-3 text-slate-500">${m.direction}</td>
          <td class="px-4 py-3">${statusBadge(m.status)}</td>
          <td class="px-4 py-3 text-slate-500">${m.retryCount}</td>
          <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${fmtTime(m.timestamp)}</td>
        </tr>
      `).join('');
    }

    function renderPageInfo(data) {
      const total = data.totalElements ?? currentData.length;
      const totalPages = data.totalPages ?? 1;
      document.getElementById('pageInfo').textContent =
        `Pagina ${currentPage + 1} van ${Math.max(totalPages, 1)} · ${total} berichten totaal`;
      document.getElementById('prevBtn').disabled = currentPage <= 0;
      document.getElementById('nextBtn').disabled = data.last === true || currentPage + 1 >= totalPages;
    }

    function openDetails(idx) {
      const m = currentData[idx];
      const rows = [
        ['Message ID', m.messageId],
        ['Ref To Message ID', m.refToMessageId || '-'],
        ['Conversation ID', m.conversationId],
        ['CPA ID', m.cpaId],
        ['From Party', m.fromPartyId],
        ['To Party', m.toPartyId],
        ['Service', m.service],
        ['Action', m.action],
        ['Direction', m.direction],
        ['Status', m.status],
        ['Retry count', m.retryCount],
        ['Last retry at', fmtTime(m.lastRetryAt)],
        ['Ack requested', m.ackRequested],
        ['Payload content-type', m.payloadContentType || '-'],
        ['Payload ref', m.payloadRef || '-'],
        ['Timestamp', fmtTime(m.timestamp)],
      ];
      document.getElementById('detailsBody').innerHTML = `
        <dl class="grid grid-cols-2 gap-2">
          ${rows.map(([k, v]) => `
            <dt class="text-slate-500">${k}</dt><dd class="text-slate-200 break-all">${v}</dd>
          `).join('')}
        </dl>
        <div>
          <p class="text-slate-500 mb-1 mt-3">Raw SOAP XML</p>
          <pre class="bg-slate-950 border border-slate-800 rounded p-3 text-xs overflow-x-auto whitespace-pre-wrap break-all max-h-64" data-testid="raw-soap-xml">${(m.rawSoapXml || '-').replace(/</g, '&lt;')}</pre>
        </div>
      `;
      document.getElementById('detailsModal').classList.remove('hidden');
    }

    document.getElementById('closeModalBtn').onclick = () =>
      document.getElementById('detailsModal').classList.add('hidden');
    document.getElementById('detailsModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailsModal') e.target.classList.add('hidden');
    });

    document.getElementById('refreshBtn').onclick = () => loadMessages(currentPage);
    document.getElementById('prevBtn').onclick = () => loadMessages(Math.max(0, currentPage - 1));
    document.getElementById('nextBtn').onclick = () => loadMessages(currentPage + 1);

    loadMessages(0);
    refreshTimer = setInterval(() => loadMessages(currentPage), 10000);
  </script>
</body>
</html>
